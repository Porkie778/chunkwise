<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Plan Minecraft bases floor by floor on a block grid, check them in 3D and export to WorldEdit or Create.">
<meta name="theme-color" content="#f7f8f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b2120" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2022%2022%22%3E%3Cpath%20d%3D%22M11%202l8%204.5-8%204.5-8-4.5z%22%20fill%3D%22%23b9481a%22/%3E%3Cpath%20d%3D%22M3%206.5l8%204.5v9l-8-4.5z%22%20fill%3D%22%231c2321%22/%3E%3Cpath%20d%3D%22M19%206.5l-8%204.5v9l8-4.5z%22%20fill%3D%22%2356625d%22/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Chunkwise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Silkscreen&display=swap">
<style>
:root{
  /* Layout: full-bleed graph-paper canvas framed by a slim tool rail, a contextual option strip and a floors/blocks panel */
  --paper:#e5e8e2; --panel:#f7f8f4; --panel-2:#eceee8; --ink:#1c2321; --ink-2:#56625d; --line:#d2d7d0;
  --accent:#b9481a; --accent-soft:#f3dccf; --on-accent:#ffffff;
  --anchor:#b0257a; --mirror:#127c8b; --multi:#3b4c98; --danger:#c42a2a;
  --grid:rgba(28,35,33,.08); --chunk:rgba(28,35,33,.24); --axis:rgba(185,72,26,.55);
  --mid-fill:rgba(206,211,209,.66); --mid-line:#d4d8d6; --mid-case:rgba(28,35,33,.55); --star:#b97c00;
  --shadow:0 8px 28px rgba(22,30,27,.16),0 1px 3px rgba(22,30,27,.12);
  --f-display:"Silkscreen",ui-monospace,monospace;
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131817; --panel:#1b2120; --panel-2:#242b29; --ink:#e2e7e4; --ink-2:#98a49f; --line:#313a37;
    --accent:#ec7b40; --accent-soft:#3d2a20; --on-accent:#1b0f08;
    --anchor:#e563b0; --mirror:#4dbdca; --multi:#8d9df2; --danger:#f06a6a;
    --grid:rgba(226,231,228,.06); --chunk:rgba(226,231,228,.18); --axis:rgba(236,123,64,.55); --mid-fill:rgba(206,211,209,.5); --mid-line:#d4d8d6; --mid-case:rgba(0,0,0,.6); --star:#f2b632;
    --shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131817; --panel:#1b2120; --panel-2:#242b29; --ink:#e2e7e4; --ink-2:#98a49f; --line:#313a37;
  --accent:#ec7b40; --accent-soft:#3d2a20; --on-accent:#1b0f08;
  --anchor:#e563b0; --mirror:#4dbdca; --multi:#8d9df2; --danger:#f06a6a;
  --grid:rgba(226,231,228,.06); --chunk:rgba(226,231,228,.18); --axis:rgba(236,123,64,.55); --mid-fill:rgba(206,211,209,.5); --mid-line:#d4d8d6; --mid-case:rgba(0,0,0,.6); --star:#f2b632;
  --shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--panel);color:var(--ink);font:14px/1.4 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

.topbar{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:15px;letter-spacing:.02em;white-space:nowrap}
.brand svg{width:22px;height:22px;display:block}
.brand svg.wordmark{width:auto;height:14px;fill:var(--ink)}
.planbtn{display:flex;align-items:center;gap:4px;flex:0 1 auto;max-width:34vw;height:34px;padding:0 8px;border:1px solid transparent;border-radius:6px;background:transparent;font-weight:700;min-width:0}
.planbtn:hover{background:var(--panel-2)}
.planbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.planbtn svg.i{width:16px;height:16px}
.savestate{font-size:12px;color:var(--ink-2);white-space:nowrap}
.ro-badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.spacer{flex:1}
.tb-group{display:flex;gap:2px}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink);padding:0;flex:none}
.ib:hover{background:var(--panel-2)}
.ib:disabled{opacity:.35;cursor:default;background:transparent}
.ib.sm{width:28px;height:28px}
.ib.sm svg.i{width:16px;height:16px}
.ib.on{background:var(--ink);color:var(--panel)}
.ib.confirm{width:auto;padding:0 8px;background:var(--danger);color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
.ib.tg[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ib.mir[aria-pressed="true"]{background:color-mix(in srgb,var(--mirror) 15%,transparent);color:var(--mirror);box-shadow:inset 0 0 0 1px var(--mirror)}
.ib.caret{width:18px;border-radius:5px}
.ib.caret svg.i{width:14px;height:14px}
.ib.tg:disabled[aria-pressed="true"]{opacity:.45}
.tb-sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.tb-title,.tb-row2{display:contents}
.tbblock{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);white-space:nowrap;font-weight:700;font-size:13px;flex:none}
.btn:hover{background:var(--panel-2)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger)}
.btn.confirm{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.tog[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn svg.i{width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px;background:var(--panel);flex:none}
.seg button{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;border:0;border-radius:5px;background:transparent;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.seg button:hover{color:var(--ink);background:var(--panel-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button svg.i{width:17px;height:17px}

.main{display:grid;grid-template-columns:56px minmax(0,1fr) 312px;grid-template-areas:"rail stage panel";min-height:0}
.rail{grid-area:rail;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto}
.tool{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:8px;background:transparent;color:var(--ink);flex:none;padding:0}
.tool:hover{background:var(--panel-2)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tool .tl{display:none}
.rail .sep{width:28px;height:1px;background:var(--line);margin:4px 0;flex:none}
.rgrp{display:flex;flex-direction:column;align-items:center;gap:3px;margin:6px 0 1px;flex:none}
.rgrp::before{content:"";width:28px;height:1px;background:var(--line)}
.rgrp span{font-size:8.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.tool.tgroup{position:relative}
.gtri{position:absolute;right:4px;bottom:4px;width:0;height:0;border-left:6px solid transparent;border-bottom:6px solid currentColor;opacity:.55}
.sbnum{font-family:var(--f-mono);font-size:11px;font-weight:600}

.stage{grid-area:stage;display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0}
.optbar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;scrollbar-width:thin;min-height:47px}
.optbar .hint{color:var(--ink-2);font-size:13px;white-space:nowrap}
.optbar .div{width:1px;height:22px;background:var(--line);flex:none}
.optbar .hint.wrap{white-space:normal;line-height:1.4;font-size:12.5px}
.optbar.acc{display:block;padding:0;overflow:visible;position:relative;z-index:8;min-height:0}
.acc-head{display:flex;align-items:center;gap:6px;padding:5px 8px}
.acc-tog{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);color:var(--ink);font-weight:700;font-size:13px;text-align:left}
.acc-tog svg.i{width:17px;height:17px;flex:none}
.acc-tog img{width:22px;height:22px;image-rendering:pixelated;border-radius:4px;flex:none}
.acc-sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-chev{display:grid;place-items:center;width:24px;height:24px;color:var(--ink-2);transition:transform .22s ease;flex:none}
.acc.open .acc-chev{transform:rotate(180deg)}
.acc.open .acc-tog{border-color:var(--ink-2)}
.acc-body{position:absolute;left:0;right:0;top:100%;display:grid;grid-template-rows:0fr;transition:grid-template-rows .24s ease;background:var(--panel)}
.acc.open .acc-body{grid-template-rows:1fr;border-bottom:1px solid var(--line);box-shadow:0 14px 24px -12px rgba(0,0,0,.35)}
.acc-in{overflow:hidden;min-height:0}
.acc-rows{display:grid;gap:10px;padding:6px 12px 14px;max-height:58vh;overflow-y:auto}
.acc-row{display:grid;grid-template-columns:70px minmax(0,1fr);align-items:center;gap:8px}
.acc-lbl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.acc-kids{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.acc-kids select.pick{max-width:100%;flex:1;min-width:0}
.acc-hint{margin:2px 0 0;font-size:12.5px;line-height:1.45;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){ .acc-body,.acc-chev{transition:none} }
.sizebox{display:inline-flex;align-items:center;gap:4px;flex:none}
.sizebox label{font-size:12px;font-weight:700;color:var(--ink-2)}
.num{width:54px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:0 4px;font-family:var(--f-mono);font-size:13px;text-align:center}
select.pick{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:0 8px;font-weight:700;font-size:13px;max-width:200px}
.blockpick{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 9px 0 4px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:12.5px;font-weight:700;white-space:nowrap;flex:none}
.blockpick img{width:24px;height:24px;image-rendering:pixelated;border-radius:3px;display:block}
.mini{width:18px;height:18px;image-rendering:pixelated;border-radius:3px;display:block}

.viewport{position:relative;overflow:hidden;background:var(--paper);min-height:0}
#c2d{display:block;touch-action:none;cursor:crosshair;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#c2d.grab{cursor:grab}
#c2d.grabbing{cursor:grabbing}
#c2d.arrow{cursor:default}
.view3d{position:absolute;inset:0;background:var(--paper)}
#c3d{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.v3bar{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;align-items:flex-end;max-width:calc(100% - 24px);max-height:calc(100% - 24px);border:1px solid transparent;border-radius:11px}
.v3bar.open{width:284px;align-items:stretch;background:var(--panel);border-color:var(--line);box-shadow:var(--shadow)}
.v3tog{flex:none;gap:7px;height:36px;padding:0 10px;color:var(--ink);cursor:pointer}
.v3tog .chv{margin-left:auto}
.v3bar.open .v3tog{border:0;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;box-shadow:none;background:transparent;padding:0 10px 0 12px}
.v3tog svg.i{width:17px;height:17px}
.v3tog .chv{color:var(--ink-2);transition:transform .2s ease}
.v3tog[aria-expanded="true"] .chv{transform:rotate(180deg)}
.v3panel{display:flex;flex-direction:column;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 12px;scrollbar-width:thin;animation:v3in .16s ease}
.v3sec{display:grid;gap:6px;padding:11px 0}
.v3sec+.v3sec{border-top:1px solid var(--line)}
.v3h{margin:0 0 1px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.v3row{display:flex;align-items:center;gap:8px;min-height:30px;font-size:12.5px;font-weight:700;color:var(--ink)}
label.v3row,.v3row>label{cursor:pointer}
.v3row>label{display:flex;align-items:center;gap:8px}
.v3row input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}
.v3row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.v3row .gpick{margin-left:auto}
.v3panel .seg{display:flex}
.v3panel .seg button{flex:1;justify-content:center;padding:0 6px}
.v3bar,.floorchip,.v3hint,.popover{transition:opacity .12s ease}
/* dragging a 3D slider clears the view: the panels fade and the slider shows at the bottom centre */
.viewport.scrubbing :is(.v3bar,.floorchip,.v3hint),.popover.scrub-hide{opacity:0}
.scrub{position:absolute;left:50%;bottom:16px;z-index:6;display:flex;align-items:center;gap:12px;width:min(440px,calc(100% - 32px));padding:10px 16px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);pointer-events:none;font-size:13px;font-weight:700;color:var(--ink);animation:scrubin .14s ease}
@keyframes scrubin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translateX(-50%)}}
.scrub-l{white-space:nowrap}
.scrub-t{position:relative;flex:1;height:6px;border-radius:3px;background:var(--line)}
.scrub-f{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.scrub-k{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.scrub-v{min-width:66px;text-align:right;font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
@media (prefers-reduced-motion:reduce){ .scrub{animation:none} }
@keyframes v3in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .v3panel{animation:none} .v3tog .chv{transition:none} }
.card{display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);font-size:12.5px;font-weight:700}
.card input[type=range]{width:96px;accent-color:var(--accent)}
.card input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}
.v3hint{position:absolute;left:12px;bottom:10px;margin:0;font-size:12px;color:var(--ink-2);pointer-events:none}
.floorchip{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);max-width:calc(100% - 24px);z-index:2}
.fc-main{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border:0;background:transparent;border-radius:6px;min-width:0;font-weight:700}
.fc-main:hover{background:var(--panel-2)}
.fc-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.fc-y{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);font-weight:400;white-space:nowrap}
.ftag{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 5px;border-radius:4px;background:var(--ink);color:var(--panel);font-family:var(--f-display);font-size:11px;letter-spacing:.04em;flex:none;border:1.5px solid var(--ink)}
.ftag.under{background:transparent;color:var(--ink);border:1.5px dashed var(--ink-2)}
.selbar{position:absolute;left:0;right:0;margin-inline:auto;width:fit-content;bottom:14px;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-width:calc(100% - 24px);overflow-x:auto;z-index:3}
.sb-info{font-size:12.5px;white-space:nowrap;color:var(--ink-2);margin:0 4px}
.sb-info b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.inspector{position:absolute;right:12px;bottom:14px;width:288px;max-width:calc(100% - 24px);padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:grid;gap:10px;z-index:4}
.inspector.lift{bottom:70px}
.insp-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.insp-kind{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.field{width:100%;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:0 9px;font-weight:700;min-width:0}
.field:disabled{background:transparent;border-color:transparent;padding:0}
.insp-meta{font-size:12px;color:var(--ink-2);font-family:var(--f-mono);line-height:1.5}
.insp-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn:disabled{opacity:.4;cursor:default;background:var(--panel)}
.insp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.insp-yinfo{display:grid;gap:2px;min-width:0}
.insp-lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.stepper.lg button{width:36px;height:34px;display:grid;place-items:center}
.stepper.lg span{min-width:104px;font-size:12px;font-weight:700;font-family:var(--f-ui)}
.stepper.lg svg.i{width:18px;height:18px}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.color{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0}
.color[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.color.custom{position:relative;background:conic-gradient(#f44,#fd3,#4d4,#3cf,#46f,#d4f,#f44)}
.color.custom::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--c,var(--panel));box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.cswatch{width:28px;height:28px;border-radius:7px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0;flex:none}
.cswatch:not(:disabled):hover{box-shadow:0 0 0 2px var(--ink)}
.popover.cpop{max-width:none;padding:10px}
.cpick{display:grid;gap:9px;width:248px}
.cp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.cp-prev{display:flex;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.cp-prev i{display:block;width:24px;height:22px}
.cp-sv{position:relative;height:140px;border-radius:8px;overflow:hidden;touch-action:none;cursor:crosshair;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cp-sv canvas{display:block;width:100%;height:100%}

  const nb = r.cells.length.toLocaleString();

  if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(d => { store.downloads = d; }).catch(() => {});
  const db = null, user = null;
  if (db) {
    store.mode = 'db'; store.db = db; store.user = user;
    let editable = true;
    if (user) { try { editable = await user.canEdit(); if (!editable) { const c = await user.can('data.write'); if (c === null) editable = true; } } catch { editable = true; } }
    store.readOnly = !editable; $('#app').classList.toggle('app-ro', !editable); $('#roBadge').hidden = editable;
    if (!editable && EDIT_TOOLS.has(view.tool)) view.tool = 'pointer';
    subscribePlans();
    if (user) user.id().then(id => { if (id) { startSettingsSync(db, id); startPackSync(db, id); } }).catch(() => {});
  } else {
    store.mode = 'local'; hideOverlay(); loadLocal();
  }
  renderRail(); setTool(view.tool);
}
boot();
})();
</script>

</body>
</html>
