name: Desktop app

# Every push to the desktop branch checks that the app builds on Windows.
# A tag like desktop-v0.2.0 builds the installer and publishes it as a GitHub release; installed apps update from there.
on:
  push:
    branches: [desktop]
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'
      - name: Build check
        shell: bash
        run: |
          cd src-tauri
          set -o pipefail
          cargo check --locked 2>&1 | tee ../check.log || cargo check 2>&1 | tee ../check.log
      - name: Keep the log where it can be read
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          cp check.log /tmp/check.log 2>/dev/null || echo "no log" > /tmp/check.log
          git fetch origin desktop-ci-log 2>/dev/null && git checkout -f desktop-ci-log 2>/dev/null || git checkout --orphan desktop-ci-log
          git rm -rf --cached . >/dev/null 2>&1 || true
          cp /tmp/check.log ./check.log; echo "${{ job.status }} ${{ github.sha }}" > status.txt
          git add check.log status.txt; git commit -m "check log for ${{ github.sha }}" >/dev/null || true
          git push -f origin HEAD:desktop-ci-log

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'
      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: 'Chunkwise desktop v__VERSION__'
          releaseBody: 'Download Chunkwise_…_x64-setup.exe below and run it. Installed copies update themselves.'
          releaseDraft: false
          prerelease: false
